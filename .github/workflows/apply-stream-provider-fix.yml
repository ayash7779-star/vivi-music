name: Apply Stream Provider Fix

on:
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix and commit
        run: |
          set -x
          python3 apply_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: JioSaavn as default stream provider + fix provider/quality reset bug"

      - name: Push to main
        run: git push origin main --force