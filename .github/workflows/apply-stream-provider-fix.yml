name: Apply Stream Provider Fix

on:
  workflow_dispatch:

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to upstream and apply fix
        run: |
          git remote add upstream https://github.com/vivizzz007/vivi-music.git
          git fetch upstream
          cp apply_fix.py /tmp/apply_fix.py
          git reset --hard upstream/main
          cp /tmp/apply_fix.py apply_fix.py
          python3 apply_fix.py
          echo "=== Checking StreamProviderKey ==="
          grep -c "StreamProviderKey" app/src/main/kotlin/com/music/vivi/constants/PreferenceKeys.kt || echo "WARNING: StreamProviderKey not found!"
          echo "=== Checking watchers ==="
          grep -c "STREAM PROVIDER" app/src/main/kotlin/com/music/vivi/playback/MusicService.kt || echo "WARNING: watcher not found!"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: JioSaavn as default stream provider + fix provider/quality reset bug"

      - name: Force push to main
        run: git push origin main --force