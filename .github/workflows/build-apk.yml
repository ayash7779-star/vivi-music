name: Build Svara APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix AndroidX datastore import
        run: |
          sed -i 's/import androidx.dataStore.preferences.core.edit/import androidx.datastore.preferences.core.edit/' app/src/main/kotlin/com/music/vivi/playback/MusicService.kt
          grep -n "import androidx.datastore.preferences.core.edit" app/src/main/kotlin/com/music/vivi/playback/MusicService.kt
          grep -n "androidx.dataStore" app/src/main/kotlin/com/music/vivi/playback/MusicService.kt || echo "No broken imports"

      - name: Apply Svara changes
        run: python3 svara_changes_v2.py .

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebrand to Svara, add AUTO_BEST provider, public downloads" || echo "Nothing to commit"
          git push origin main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Generate debug keystore
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -alias vivi-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Svara, OU=Build, O=GitHub Actions, L=NA, S=NA, C=IN"

      - name: Build APK
        env:
          STORE_PASSWORD: android
          KEY_ALIAS: vivi-release
          KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease --no-daemon --stacktrace

      - name: Find and list APK files
        if: always()
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -type f
          echo "=== outputs dir ==="
          find app/build/outputs -type d || echo "No outputs dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svara-universal-foss-release
          path: app/build/outputs/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Rename and prepare APK
        run: |
          APK_PATH=$(find app/build/outputs -name "*.apk" -type f | head -1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" svara-universal-foss-release.apk
          ls -la svara-universal-foss-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.5-svara
          name: Svara v6.0.5
          body: |
            ## Svara - Built by Yash Agrawal

            ### Changes
            - Rebranded from Vivi Music to Svara
            - JioSaavn is the default stream provider
            - Added Auto (Best Quality) stream provider option
            - Stream provider/quality selection persists across playback sessions
            - Downloads now appear in public Downloads/Svara folder
            - All other providers, lyrics, and features intact
          files: svara-universal-foss-release.apk
          draft: false
          prerelease: false
