name: Build Svara APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix AndroidX datastore import
        run: |
          sed -i 's/import androidx.dataStore.preferences.core.edit/import androidx.datastore.preferences.core.edit/' app/src/main/kotlin/com/music/vivi/playback/MusicService.kt || true

      - name: Apply Svara changes
        run: python3 svara_apply.py .

      - name: Fix string resource keys (revert name attributes)
        run: |
          find app/src/main/res app/src/debug/res -name '*.xml' -exec sed -i 's/name="\([^"]*\)Svara\([^"]*\)"/name="\1vivimusic\2"/g' {} + 2>/dev/null || true
          find app/src/main/res app/src/debug/res -name '*.xml' -exec sed -i 's/name="\([^"]*\)SVARA\([^"]*\)"/name="\1VIVIMUSIC\2"/g' {} + 2>/dev/null || true
          echo "Fixed string resource name attributes"

      - name: Fix DownloadUtil compilation
        run: |
          python3 -c "
          import re
          p = 'app/src/main/kotlin/com/music/vivi/playback/DownloadUtil.kt'
          with open(p) as f:
              c = f.read()
          c = c.replace('\n                                    copyToPublicDownloads(download.request.id)', '')
          c = re.sub(r'\n    private fun copyToPublicDownloads\(.*?\n    \}\n', '', c, flags=re.DOTALL)
          c = c.replace('import android.os.Environment\n', '')
          c = c.replace('import java.io.File\n', '')
          c = c.replace('import java.io.FileOutputStream\n', '')
          c = c.replace('import androidx.media3.datasource.DataSpec\n', '')
          with open(p, 'w') as f:
              f.write(c)
          print('Fixed DownloadUtil.kt')
          "

      - name: Fix WelcomeActivity (developer name, remove community/features pages)
        run: python3 fix_welcome.py

      - name: Generate app icons from user icon
        run: |
          pip install Pillow --quiet
          python3 generate_icon.py

      - name: Commit all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Svara branding, icon, AUTO_BEST provider, hide videos, fix setup screens" || echo "Nothing to commit"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools
          sdkmanager --list_installed 2>/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true
          echo "SDK setup done"

      - name: Generate debug keystore
        run: |
          mkdir -p /home/runner/.android
          keytool -genkeypair -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          chmod +x gradlew
          ./gradlew assembleUniversalFossDebug --no-daemon -x lint

      - name: Find and list APK files
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -type f
          echo "=== outputs dir ==="
          find app/build/outputs -type d || echo "No outputs dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svara-apk
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          if-no-files-found: error

      - name: Rename and prepare APK
        run: |
          mkdir -p release
          find app/build/outputs/apk -name "*.apk" -exec cp {} release/Svara.apk \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: svara-v6.0.6
          name: Svara v6.0.6
          body: |
            Svara - Music Player by Yash Agrawal
            
            Features:
            - Auto (Best Quality) stream provider
            - Videos hidden from search and home by default
            - Custom स्वर app icon
            - Clean setup screens (no Telegram/community links)
          files: release/Svara.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
