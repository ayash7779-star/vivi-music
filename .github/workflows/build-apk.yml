name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Generate debug keystore for release signing
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v             -keystore app/keystore/release.keystore             -alias vivi-release             -keyalg RSA -keysize 2048 -validity 10000             -storepass android             -keypass android             -dname "CN=Vivi Music, OU=Build, O=GitHub Actions, L=NA, S=NA, C=IN"

      - name: Build universal FOSS release APK
        env:
          STORE_PASSWORD: android
          KEY_ALIAS: vivi-release
          KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivi-music-universal-foss-release
          path: app/build/outputs/apk/universal/foss/release/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7

      - name: Rename APK
        if: success()
        run: |
          cd app/build/outputs/apk/universal/foss/release/
          cp app-universal-foss-release.apk vivi-music-jiosaavn-universal-foss-release.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.5-jiosaavn
          name: Vivi Music v6.0.5 (JioSaavn Default)
          body: |
            ## Changes

            - JioSaavn is now the default stream provider
            - Fixed critical bug: stream provider and quality selection now persists across playback sessions
            - Stream provider cache is cleared and playback reloads on provider/quality change
            - All other providers (Tidal, Spotify, Apple Music, YouTube Music) remain available
            - All lyrics providers and features intact
          files: |
            app/build/outputs/apk/universal/foss/release/vivi-music-jiosaavn-universal-foss-release.apk
          draft: false
          prerelease: false
