name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix broken AndroidX datastore import
        run: |
          sed -i 's/import androidx.dataStore.preferences.core.edit/import androidx.datastore.preferences.core.edit/' app/src/main/kotlin/com/music/vivi/playback/MusicService.kt
          grep -n "import androidx.datastore.preferences.core.edit" app/src/main/kotlin/com/music/vivi/playback/MusicService.kt
          grep -n "androidx.dataStore" app/src/main/kotlin/com/music/vivi/playback/MusicService.kt || echo "No broken imports found"

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore correct androidx.datastore import casing" || echo "Nothing to commit"
          git push origin main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'

      - name: Generate debug keystore
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -alias vivi-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Vivi Music, OU=Build, O=GitHub Actions, L=NA, S=NA, C=IN"

      - name: Build APK
        env:
          STORE_PASSWORD: android
          KEY_ALIAS: vivi-release
          KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalFossRelease --no-daemon --stacktrace

      - name: Find and list APK files
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -type f
          echo "=== APK directory structure ==="
          find app/build/outputs -type f -name "*.apk" || echo "No APK in outputs"
          echo "=== Full outputs dir ==="
          find app/build/outputs -type d || echo "No outputs dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivi-music-jiosaavn-apk
          path: |
            app/build/outputs/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Rename and prepare APK
        run: |
          APK_PATH=$(find app/build/outputs -name "*.apk" -type f | head -1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" vivi-music-jiosaavn-universal-foss-release.apk
          ls -la vivi-music-jiosaavn-universal-foss-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.5-jiosaavn
          name: Vivi Music v6.0.5 (JioSaavn Default)
          body: |
            ## Changes

            - JioSaavn is now the default stream provider
            - Fixed critical bug: stream provider and quality selection now persists across playback sessions
            - Stream provider cache is cleared and playback reloads on provider/quality change
            - All other providers remain available
            - All lyrics providers and features intact
          files: vivi-music-jiosaavn-universal-foss-release.apk
          draft: false
          prerelease: false
